name: update-live

on:
  schedule:
    - cron: "17 */6 * * *"     # 每 6 小时（UTC），整点外偏移以避开高峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live sources
        env:
          PROBE_WORKERS: "128"
        run: python3 scripts/build_live.py --seeds sources/seeds.json --out output --min-ok 50 --probe-budget 1500

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update live sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
